<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thư viện ảnh tương tác</title>
    <style>
        body { margin: 20px; font-family: sans-serif; background-color: #f0f0f0; }
        #image {
            width: 100%; max-width: 600px; height: 300px;
            border: 5px solid #333; margin: 0 auto 20px auto;
            background-color: #8e8e8e; color: #fff;
            text-align: center; line-height: 300px; font-size: 150%;
            background-size: cover; background-position: center;
            background-repeat: no-repeat;
        }
        .preview {
            width: 100px; height: 100px; border: 3px solid #333;
            margin: 10px; cursor: pointer; object-fit: cover;
        }
        .flex { display: flex; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="image">Hover over an image below to display here.</div>

    <div class="flex">
        <img class="preview" alt="Bánh mì Việt Nam" src="https://images.unsplash.com/photo-1601050690597-df056fb4ce78?w=500" onmouseover="upDate(this)" onmouseleave="undo()">
        <img class="preview" alt="Phở bò Hà Nội" src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=500" onmouseover="upDate(this)" onmouseleave="undo()">
        <img class="preview" alt="Cà phê sữa đá" src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" onmouseover="upDate(this)" onmouseleave="undo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
